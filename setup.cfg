# Lint configuration for the UNO / Cahn-Hilliard project.
#
# Present so that flake8 / pycodestyle / pylint agree on line width regardless of
# whatever global default is installed.  pycodestyle's default is 79, which flags
# ~130 lines here purely on width; the project is written to 88 (the Black
# convention).  A config file in the project root takes precedence over user and
# global settings, so no editor-side change is needed.

[flake8]
max-line-length = 88
extend-ignore =
    # module-level import not at top of file: matplotlib.use("Agg") must run
    # before pyplot is imported, so this one is unavoidable and intentional.
    E402,
    # whitespace before ':' -- conflicts with slice formatting
    E203
exclude = legacy,Results,.git,__pycache__

[pycodestyle]
max-line-length = 88
ignore = E402,E203
exclude = legacy,Results,.git,__pycache__

[pylint]
max-line-length = 88
